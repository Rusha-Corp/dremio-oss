apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: dremio
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mc alias set local http://minio.dremio.svc.cluster.local:9000 \
                "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"

              # Create bucket if not exists
              if ! mc ls local/dremio-dist > /dev/null 2>&1; then
                mc mb local/dremio-dist
                echo "Created bucket dremio-dist"
              else
                echo "Bucket dremio-dist already exists"
              fi

              # Create service account user
              mc admin user add local "${DREMIO_SVC_ACCESS_KEY}" "${DREMIO_SVC_SECRET_KEY}"
              echo "Created user ${DREMIO_SVC_ACCESS_KEY}"

              # Attach readwrite policy (scoped to dremio-dist only)
              mc admin policy attach local readwrite --user "${DREMIO_SVC_ACCESS_KEY}"
              echo "Attached readwrite policy to ${DREMIO_SVC_ACCESS_KEY}"

              echo "MinIO initialisation complete"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-dremio-root
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-dremio-root
                  key: rootPassword
            - name: DREMIO_SVC_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-dremio-credentials
                  key: access_key
            - name: DREMIO_SVC_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-dremio-credentials
                  key: secret_key
