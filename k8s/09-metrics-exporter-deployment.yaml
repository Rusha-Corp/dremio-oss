apiVersion: apps/v1
kind: Deployment
metadata:
  name: dremio-metrics-exporter
  namespace: dremio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dremio-metrics-exporter
  template:
    metadata:
      labels:
        app: dremio-metrics-exporter
    spec:
      serviceAccountName: dremio-metrics-exporter
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: metrics-exporter
          image: ghcr.io/rusha-corp/dremio-keda-exporter:2026.05.6
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
          env:
            - name: DREMIO_URL
              value: "http://dremio-coordinator.dremio.svc.cluster.local:9047"
            - name: DREMIO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dremio-ops-credentials
                  key: DREMIO_USERNAME
            - name: DREMIO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dremio-ops-credentials
                  key: DREMIO_PASSWORD
            - name: NAMESPACE
              value: "dremio"
            - name: SCALE_DOWN_GRACE_SECS
              value: "1800"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "512Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
              ephemeral-storage: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: dremio-metrics-exporter
  namespace: dremio
spec:
  selector:
    app: dremio-metrics-exporter
  ports:
    - port: 5001
      targetPort: 5001
  type: ClusterIP
