apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: dremio-executor-large
  namespace: dremio
spec:
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          policies:
            - periodSeconds: 120
              type: Pods
              value: 1
          stabilizationWindowSeconds: 300
        scaleUp:
          policies:
            - periodSeconds: 30
              type: Pods
              value: 2
          stabilizationWindowSeconds: 0
  cooldownPeriod: 600
  maxReplicaCount: 8
  minReplicaCount: 0
  pollingInterval: 10
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: dremio-executor-large
  triggers:
    # Primary: coordinator's published desired count drives replica count
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.rusha.svc.cluster.local:9090
        metricName: elastic_desired_large
        query: "elastic_desired_large"
        threshold: "1"
        activationThreshold: "0"
    # Guard: keep at least 1 while any job or query plan is active.
    # KEDA takes the max across all triggers, so this holds the tier alive even
    # during the 30s idle-reset window after coordinator's metric drops to 0.
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.rusha.svc.cluster.local:9090
        metricName: dremio_work_active_large
        query: "clamp_min(jobs_active + maestro_active, 0)"
        threshold: "1"
        activationThreshold: "0"
