# StatefulSet for dremio-executor-large.
# Created with replicas: 0 so KEDA's ScaledObject has a valid scaleTargetRef from day 0.
# KEDA scales this StatefulSet based on the executor_desired_large metric.
#
# Uses a shared ReadWriteMany PVC for paths.dist (same as coordinator)
# and a per-pod volumeClaimTemplate for local spill/cache data.
#
# Sizing matches AWS i4i.2xlarge: 8 vCPU, 64 GiB RAM, NVMe storage.
# JVM split: 8 GB heap / 52 GB direct = 60 GB total, 4 GB for OS/JVM overhead.
# nodeSelector pins pods to NVMe nodes labeled workload=dremio-large.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dremio-executor-large
  namespace: dremio
  labels:
    app: dremio
    role: executor
    tier: large
spec:
  updateStrategy:
    type: OnDelete
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Delete
  serviceName: dremio-executor
  replicas: 0
  selector:
    matchLabels:
      app: dremio
      role: executor
      tier: large
  template:
    metadata:
      labels:
        app: dremio
        role: executor
        tier: large
    spec:
      containers:
        - name: executor
          image: ghcr.io/rusha-corp/dremio-oss:2026.07.4
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: DREMIO_CONF_DIR
              value: "/opt/dremio/conf"
            # Use stable StatefulSet DNS hostname as the fabric address.
            # This ensures executors register with a stable DNS name instead of a
            # volatile pod IP, preventing "No executors available for data with hard
            # affinity" errors when executors are recreated with new IPs.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              value: "$(POD_NAME).dremio-executor.dremio.svc.cluster.local"
            # Do NOT use DREMIO_JAVA_OPTS for -Xmx; the dremio launcher resets
            # DREMIO_JAVA_OPTS and re-appends -Xmx/-XX:MaxDirectMemorySize from
            # DREMIO_MAX_HEAP_MEMORY_SIZE_MB / DREMIO_MAX_DIRECT_MEMORY_SIZE_MB.
            # i4i.2xlarge split: 8 GB heap / 52 GB direct = 60 GB JVM, 4 GB OS.
            - name: DREMIO_MAX_HEAP_MEMORY_SIZE_MB
              value: "8192"
            - name: DREMIO_MAX_DIRECT_MEMORY_SIZE_MB
              value: "53248"
          volumeMounts:
            - name: dremio-config
              mountPath: /opt/dremio/conf
            - name: dremio-dist
              mountPath: /opt/dremio/dist
            - name: dremio-local
              mountPath: /opt/dremio/data
          resources:
            requests:
              cpu: "8"
              memory: "62Gi"
              ephemeral-storage: "50Gi"
            limits:
              cpu: "8"
              memory: "62Gi"
              ephemeral-storage: "100Gi"
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 120"]
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: dremio
                    role: executor
                topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 0
      subdomain: dremio-executor
      imagePullSecrets:
        - name: ghcr-secret
      serviceAccountName: dremio-elastic
      terminationGracePeriodSeconds: 1800
      volumes:
        - name: dremio-config
          configMap:
            name: dremio-executor-config-large
        - name: dremio-dist
          persistentVolumeClaim:
            claimName: dremio-dist
  volumeClaimTemplates:
    - metadata:
        name: dremio-local
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 100Gi
