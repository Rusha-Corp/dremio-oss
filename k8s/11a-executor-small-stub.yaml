# StatefulSet for dremio-executor-small.
# Created with replicas: 0 so KEDA's ScaledObject has a valid scaleTargetRef from day 0.
# KEDA scales this StatefulSet based on the executor_desired_small metric.
#
# Uses a shared ReadWriteMany PVC for paths.dist (same as coordinator).
# StatefulSet provides stable network identity (dremio-executor-small-0.dremio-executor)
# and ensures pod DNS is registered before ZK joins.
#
# Resource requests/limits: size these to fit your small executor node type.
# Dremio Java only patches .spec.replicas — resource values are owned by the operator.
# See docs/elastic-scaling-deployment.md for sizing guidance.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dremio-executor-small
  namespace: dremio
  labels:
    app: dremio
    role: executor
    tier: small
spec:
  serviceName: dremio-executor
  replicas: 0
  selector:
    matchLabels:
      app: dremio
      role: executor
      tier: small
  template:
    metadata:
      labels:
        app: dremio
        role: executor
        tier: small
    spec:
      nodeSelector:
        kubernetes.io/hostname: vmi1594378.contaboserver.net
      containers:
        - name: executor
          image: ghcr.io/rusha-corp/dremio-oss:2026.05.4
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: DREMIO_CONF_DIR
              value: "/opt/dremio/conf"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: dremio-config
              mountPath: /opt/dremio/conf
            - name: dremio-dist
              mountPath: /opt/dremio/dist
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
              ephemeral-storage: "5Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
              ephemeral-storage: "10Gi"
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 120"]
      securityContext:
        fsGroup: 0
      subdomain: dremio-executor
      imagePullSecrets:
        - name: ghcr-secret
      serviceAccountName: dremio-elastic
      terminationGracePeriodSeconds: 1800
      volumes:
        - name: dremio-config
          configMap:
            name: dremio-executor-config-small
        - name: dremio-dist
          persistentVolumeClaim:
            claimName: dremio-dist
