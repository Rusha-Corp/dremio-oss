apiVersion: v1
kind: ConfigMap
metadata:
  name: dremio-config
  namespace: dremio
data:
  logback.xml: |
    <?xml version="1.0" encoding="UTF-8" ?>
    <configuration scan="true" scanPeriod="30 seconds">
      <turboFilter class="com.dremio.common.logging.obfuscation.BlockLogLevelTurboFilter">
        <defaultLogLevelThreshold>INFO</defaultLogLevelThreshold>
        <packageLogLevel>com.dremio,DEBUG</packageLogLevel>
      </turboFilter>
      <contextListener class="ch.qos.logback.classic.jul.LevelChangePropagator"/>
      <appender name="console" class="ch.qos.logback.core.ConsoleAppender">
        <encoder>
          <pattern>%date{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n</pattern>
        </encoder>
      </appender>
      <!-- Suppress Jetty HTTP buffer dumps (thousands of DEBUG lines per second) -->
      <logger name="org.eclipse.jetty" level="WARN"/>
      <!-- Suppress Netty wire-level hex dumps -->
      <logger name="io.netty" level="WARN"/>
      <!-- Suppress verbose AWS SDK HTTP/retry logs -->
      <logger name="software.amazon.awssdk" level="WARN"/>
      <logger name="com.amazonaws" level="WARN"/>
      <logger name="org.apache.hadoop.hdfs.DFSClient" level="WARN"/>
      <logger name="com.dremio">
        <level value="${dremio.log.level:-info}"/>
      </logger>
      <root>
        <level value="${dremio.log.root.level:-error}"/>
        <appender-ref ref="console"/>
      </root>
    </configuration>
  dremio.conf: |
    paths: {
      local: "/opt/dremio/data"
      dist: "pdfs:///opt/dremio/dist"
    }
    registration.publish-host: "dremio-coordinator-0.dremio-coordinator.dremio.svc.cluster.local"
    services: {
      coordinator.enabled: true,
      coordinator.master.enabled: true,
      coordinator.master.embedded-zookeeper.enabled: false,
      coordinator.web.port: 9047,
      coordinator.web.auth.type: "internal",
      flight.port: 32010,
      executor.enabled: false,
      executor.elastic.enabled: true,
      executor.elastic.max_executors_small: 2,
      executor.elastic.max_executors_large: 3,
      executor.elastic.scale_timeout_minutes: 20,
      web-admin.host: "0.0.0.0",
      web-admin.port: 45679
    }
    # External ZooKeeper ensemble — decouples ZK from coordinator lifecycle
    # so coordinator rolling updates do not disrupt executor registrations.
    zookeeper: "dremio-zk-0.dremio-zk.dremio.svc.cluster.local:2181,dremio-zk-1.dremio-zk.dremio.svc.cluster.local:2181,dremio-zk-2.dremio-zk.dremio.svc.cluster.local:2181"
