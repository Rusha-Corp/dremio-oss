apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: dremio-executor-small
  namespace: dremio
spec:
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          policies:
            - periodSeconds: 120
              type: Pods
              value: 1
          stabilizationWindowSeconds: 300
        scaleUp:
          policies:
            - periodSeconds: 30
              type: Pods
              value: 2
          stabilizationWindowSeconds: 0
  cooldownPeriod: 600
  maxReplicaCount: 4
  minReplicaCount: 0
  pollingInterval: 10
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: dremio-executor-small
  triggers:
    # Primary: coordinator's published desired count drives replica count
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.dremio.svc.cluster.local:9090
        metricName: elastic_desired_small
        query: "elastic_desired_small"
        threshold: "1"
        activationThreshold: "0"
    # Guard: keep at least 1 while any work is active on small tier
    # (jobs, maestro sessions, reflections). Prevents KEDA from scaling
    # down during the idle-reset window or cooldown period.
    # Uses total reflections_active + reflections_refreshing (not tier-specific)
    # because the tier-specific reflection metrics are not yet deployed.
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.dremio.svc.cluster.local:9090
        metricName: dremio_work_active_small
        query: "clamp_max(jobs_active_small + maestro_active_small + reflections_active + reflections_refreshing, 1)"
        threshold: "1"
        activationThreshold: "0"
