apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: dremio-executor-large
  namespace: dremio
spec:
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          policies:
            - periodSeconds: 120
              type: Pods
              value: 1
          stabilizationWindowSeconds: 300
        scaleUp:
          policies:
            - periodSeconds: 30
              type: Pods
              value: 2
          stabilizationWindowSeconds: 0
  cooldownPeriod: 600
  maxReplicaCount: 3
  minReplicaCount: 0
  pollingInterval: 10
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: dremio-executor-large
  triggers:
    # Primary: coordinator's published desired count drives replica count
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.dremio.svc.cluster.local:9090
        metricName: elastic_desired_large
        query: "elastic_desired_large"
        threshold: "1"
        activationThreshold: "0"
    # Guard: keep at least 1 while ANY work is active (jobs, maestro, reflections).
    # Uses total jobs_active + maestro_active (not tier-specific) because small-tier
    # queries can fall back to large executors via ExecutorSelectionServiceImpl
    # fallback routing. Uses total reflections_active + reflections_refreshing
    # because the tier-specific reflection metrics are not yet deployed.
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.dremio.svc.cluster.local:9090
        metricName: dremio_work_active_large
        query: "clamp_max(jobs_active + maestro_active + reflections_active + reflections_refreshing, 1)"
        threshold: "1"
        activationThreshold: "0"
