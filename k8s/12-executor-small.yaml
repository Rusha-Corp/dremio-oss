apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dremio-executor-small
  namespace: dremio
  labels:
    app: dremio
    role: executor
    tier: small
spec:
  updateStrategy:
    type: OnDelete
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Delete
  replicas: 0
  selector:
    matchLabels:
      app: dremio
      role: executor
      tier: small
  serviceName: dremio-executor
  template:
    metadata:
      labels:
        app: dremio
        role: executor
        tier: small
    spec:
      containers:
        - name: executor
          image: ghcr.io/rusha-corp/dremio-oss:2026.07.2
          imagePullPolicy: Always
          env:
            - name: DREMIO_CONF_DIR
              value: /opt/dremio/conf
            # Use stable StatefulSet DNS hostname as the fabric address.
            # This ensures executors register with a stable DNS name instead of a
            # volatile pod IP, preventing "No executors available for data with hard
            # affinity" errors when executors are recreated with new IPs.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              value: "$(POD_NAME).dremio-executor.dremio.svc.cluster.local"
            # Do NOT use DREMIO_JAVA_OPTS for -Xmx; the dremio launcher resets
            # DREMIO_JAVA_OPTS and re-appends -Xmx/-XX:MaxDirectMemorySize from
            # DREMIO_MAX_HEAP_MEMORY_SIZE_MB / DREMIO_MAX_DIRECT_MEMORY_SIZE_MB.
            # t3a.xlarge split: 4 GB heap / 11 GB direct = 15 GB JVM, 1 GB for OS.
            - name: DREMIO_MAX_HEAP_MEMORY_SIZE_MB
              value: "4096"
            - name: DREMIO_MAX_DIRECT_MEMORY_SIZE_MB
              value: "11264"
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 120
          ports:
            - containerPort: 45678
              name: inter-node
          readinessProbe:
            tcpSocket:
              port: 45678
            failureThreshold: 3
            initialDelaySeconds: 60
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          startupProbe:
            tcpSocket:
              port: 45678
            failureThreshold: 300
            periodSeconds: 2
          resources:
            limits:
              cpu: "4"
              ephemeral-storage: 20Gi
              memory: 15Gi
            requests:
              cpu: "4"
              ephemeral-storage: 5Gi
              memory: 15Gi
          securityContext:
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - mountPath: /opt/dremio/conf
              name: dremio-config
            - mountPath: /opt/dremio/dist
              name: dremio-dist
            - mountPath: /opt/dremio/data
              name: dremio-local
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: dremio
                    role: executor
                topologyKey: kubernetes.io/hostname
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        fsGroup: 0
      serviceAccount: dremio-elastic
      serviceAccountName: dremio-elastic
      subdomain: dremio-executor
      terminationGracePeriodSeconds: 1800
      volumes:
        - configMap:
            name: dremio-executor-config-small
          name: dremio-config
        - name: dremio-dist
          persistentVolumeClaim:
            claimName: dremio-dist
  volumeClaimTemplates:
    - metadata:
        name: dremio-local
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 30Gi
        storageClassName: longhorn
