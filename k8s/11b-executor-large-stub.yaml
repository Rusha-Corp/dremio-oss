# StatefulSet for dremio-executor-large.
# Created with replicas: 0 so KEDA's ScaledObject has a valid scaleTargetRef from day 0.
# KEDA scales this StatefulSet based on the executor_desired_large metric.
#
# Uses a shared ReadWriteMany PVC for paths.dist (same as coordinator)
# and a per-pod volumeClaimTemplate for local spill/cache data.
#
# Resource requests/limits: size these to fit your large executor node type.
# When the Cluster Autoscaler adds large executor nodes, every pod on every node
# must reach the same paths.dist. The shared RWX PVC handles this automatically.
# See docs/elastic-scaling-deployment.md for sizing guidance.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dremio-executor-large
  namespace: dremio
  labels:
    app: dremio
    role: executor
    tier: large
spec:
  serviceName: dremio-executor
  replicas: 0
  selector:
    matchLabels:
      app: dremio
      role: executor
      tier: large
  template:
    metadata:
      labels:
        app: dremio
        role: executor
        tier: large
    spec:
      nodeSelector:
        kubernetes.io/hostname: vmi1594378.contaboserver.net
      containers:
        - name: executor
          image: ghcr.io/rusha-corp/dremio-oss:2026.05.5
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: DREMIO_CONF_DIR
              value: "/opt/dremio/conf"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: dremio-config
              mountPath: /opt/dremio/conf
            - name: dremio-dist
              mountPath: /opt/dremio/dist
            - name: dremio-local
              mountPath: /opt/dremio/data
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              ephemeral-storage: "10Gi"
            limits:
              cpu: "4"
              memory: "16Gi"
              ephemeral-storage: "20Gi"
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 120"]
      securityContext:
        fsGroup: 0
      subdomain: dremio-executor
      imagePullSecrets:
        - name: ghcr-secret
      serviceAccountName: dremio-elastic
      terminationGracePeriodSeconds: 1800
      volumes:
        - name: dremio-config
          configMap:
            name: dremio-executor-config-large
        - name: dremio-dist
          persistentVolumeClaim:
            claimName: dremio-dist
  volumeClaimTemplates:
    - metadata:
        name: dremio-local
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 100Gi
