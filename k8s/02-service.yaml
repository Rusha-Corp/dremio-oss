apiVersion: v1
kind: Service
metadata:
  name: dremio-coordinator
  namespace: dremio
spec:
  clusterIP: None  # Headless service for pod DNS
  ports:
    - port: 9047
      targetPort: 9047
      name: web
    - port: 45678
      targetPort: 45678
      name: rpc
    - port: 32010
      targetPort: 32010
      name: flight
    - port: 45679
      targetPort: 45679
      name: liveness
  selector:
    app: dremio
    role: coordinator
