apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: dremio-executor-small
  namespace: dremio
spec:
  scaleTargetRef:
    kind: StatefulSet
    name: dremio-executor-small
  minReplicaCount: 1
  maxReplicaCount: 2
  pollingInterval: 10
  cooldownPeriod: 1800
  triggers:
    - type: metrics-api
      metadata:
        url: http://dremio-metrics-exporter.dremio.svc.cluster.local:5001/json
        valueLocation: executor_desired_small
        targetValue: "1"
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 1800
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: dremio-executor-large
  namespace: dremio
spec:
  scaleTargetRef:
    kind: StatefulSet
    name: dremio-executor-large
  minReplicaCount: 0
  maxReplicaCount: 8
  pollingInterval: 10
  cooldownPeriod: 1800
  triggers:
    - type: metrics-api
      metadata:
        url: http://dremio-metrics-exporter.dremio.svc.cluster.local:5001/json
        valueLocation: executor_desired_large
        targetValue: "1"
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 1800
