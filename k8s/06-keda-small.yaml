apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: dremio-executor-small
  namespace: dremio
spec:
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          policies:
            - periodSeconds: 120
              type: Pods
              value: 1
          stabilizationWindowSeconds: 300
        scaleUp:
          policies:
            - periodSeconds: 30
              type: Pods
              value: 2
          stabilizationWindowSeconds: 0
  cooldownPeriod: 600
  maxReplicaCount: 4
  minReplicaCount: 0
  pollingInterval: 10
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: dremio-executor-small
  triggers:
    # Primary: coordinator's published desired count drives replica count
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.rusha.svc.cluster.local:9090
        metricName: elastic_desired_small
        query: "elastic_desired_small"
        threshold: "1"
        activationThreshold: "0"
    # Guard: keep at least 1 while any job, query plan, or reflection is active.
    # KEDA takes the max across all triggers, so this holds the tier alive even
    # during the 30s idle-reset window after coordinator's metric drops to 0.
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.rusha.svc.cluster.local:9090
        metricName: dremio_work_active_small
        query: "clamp_min(jobs_active_small + maestro_active_small + reflections_active_small, 0)"
        threshold: "1"
        activationThreshold: "0"
