apiVersion: batch/v1
kind: CronJob
metadata:
  name: nessie-token-rotator
  namespace: dremio
spec:
  # Run every 6 hours. Cognito token TTL is 24h, giving 4 retry windows per day.
  # If one run fails, the next run has another chance before the token expires.
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: rotator
              image: ghcr.io/rusha-corp/nessie-token-rotator:latest
              imagePullPolicy: Always
              envFrom:
                - configMapRef:
                    name: nessie-token-rotator-config
                - secretRef:
                    name: nessie-token-rotator-secret
          imagePullSecrets:
            - name: ghcr-secret
